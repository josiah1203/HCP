# Integration test stack — Postgres, Redis, MinIO only (no API/parser).
# Used by CI and: docker compose -f docker-compose.test.yml up -d --wait

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hcp
      POSTGRES_PASSWORD: hcp
      POSTGRES_DB: hcp_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcp -d hcp_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: hcp
      MINIO_ROOT_PASSWORD: hcpsecret
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hcp hcpsecret &&
      mc mb -p local/hcp-local || true &&
      exit 0
      "
