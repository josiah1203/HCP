[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcp-sdk"
version = "0.1.0"
description = "Python SDK for Hardware Cloud Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=hcp --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["hcp"]
