[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hw-cli"
version = "0.1.0"
description = "HCP hardware CLI (Phase 0.5 beta)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
hw = "hw.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
