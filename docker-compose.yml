services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hcp
      POSTGRES_PASSWORD: hcp
      POSTGRES_DB: hcp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcp -d hcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hcp
      MINIO_ROOT_PASSWORD: hcpsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/hcpsecret
      NEO4J_PLUGINS: '[]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hcp hcpsecret &&
      mc mb -p local/hcp-local || true &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HCP_PROVIDER: onprem-compose
      HCP_ENV: dev
      DATABASE_URL: postgresql+psycopg2://hcp:hcp@postgres:5432/hcp
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-in-production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: hcp
      MINIO_SECRET_KEY: hcpsecret
      MINIO_BUCKET: hcp-local
      MINIO_REGION: us-east-1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hcpsecret
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: hcp-versions
      PYTHONPATH: /app:/app/api:/app/graph
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app/api
      - ./graph:/app/graph
      - ./infra:/app/infra
    command: >
      sh -c "cd /app/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    environment:
      HCP_PROVIDER: onprem-compose
      DATABASE_URL: postgresql+psycopg2://hcp:hcp@postgres:5432/hcp
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: hcp
      MINIO_SECRET_KEY: hcpsecret
      MINIO_BUCKET: hcp-local
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hcpsecret
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: hcp-versions
      PYTHONPATH: /app:/app/api:/app/graph
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./parser:/app/parser
      - ./graph:/app/graph
      - ./api/app:/app/api/app
      - ./infra:/app/infra

  graph-worker:
    build:
      context: .
      dockerfile: parser/Dockerfile
    environment:
      HCP_PROVIDER: onprem-compose
      DATABASE_URL: postgresql+psycopg2://hcp:hcp@postgres:5432/hcp
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: hcp
      MINIO_SECRET_KEY: hcpsecret
      MINIO_BUCKET: hcp-local
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hcpsecret
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: hcp-versions
      PYTHONPATH: /app:/app/api:/app/graph
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./parser:/app/parser
      - ./graph:/app/graph
      - ./api/app:/app/api/app
      - ./infra:/app/infra
    command: >
      celery -A graph.tasks.celery_app worker --loglevel=info -Q hcp.graph

volumes:
  pgdata:
  minio-data:
  neo4j-data:
  opensearch-data:
