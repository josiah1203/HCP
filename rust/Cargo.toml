[workspace]
members = [
  "crates/sidecar-protocol",
  "crates/sidecar-runner",
  "crates/hnf-adapter",
  "crates/kicad-sidecar",
  "crates/simulation-sidecars",
  "crates/freecad-sidecar",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
