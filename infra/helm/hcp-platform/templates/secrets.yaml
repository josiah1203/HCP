{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: hcp-credentials
  namespace: {{ include "hcp-platform.namespace" . }}
  labels:
    app.kubernetes.io/part-of: hcp-platform
type: Opaque
stringData:
  DATABASE_URL: {{ include "hcp-platform.databaseUrl" . | quote }}
  REDIS_URL: {{ include "hcp-platform.redisUrl" . | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  MINIO_BUCKET: {{ .Values.secrets.minioBucket | quote }}
  MINIO_ENDPOINT: {{ include "hcp-platform.minioEndpoint" . | quote }}
  MINIO_REGION: {{ .Values.secrets.minioRegion | quote }}
  POSTGRES_HOST: {{ include "hcp-platform.postgresHost" . | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
{{- end }}
