{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  namespace: {{ include "hcp-platform.namespace" . }}
  labels:
    app.kubernetes.io/part-of: hcp-platform
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:15-alpine
          env:
            - name: PGHOST
              value: {{ include "hcp-platform.postgresHost" . | quote }}
            - name: PGUSER
              value: {{ .Values.secrets.postgresUser | quote }}
            - name: PGPASSWORD
              value: {{ .Values.secrets.postgresPassword | quote }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER"; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: alembic
          {{- $api := index .Values "hcp-api" }}
          image: "{{ $api.image.repository }}:{{ $api.image.tag }}"
          imagePullPolicy: {{ $api.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: hcp-credentials
          env:
            - name: PYTHONPATH
              value: /app:/app/api:/app/graph
          command:
            - sh
            - -c
            - cd /app/api && alembic upgrade head
{{- end }}
