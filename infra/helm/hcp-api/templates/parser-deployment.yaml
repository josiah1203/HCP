{{- if .Values.parser.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hcp-api.fullname" . }}-parser
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hcp-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: parser
spec:
  replicas: {{ .Values.parser.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hcp-api.name" . }}-parser
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hcp-api.name" . }}-parser
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: parser
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:15-alpine
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - until pg_isready -h "$PGHOST" -U "$PGUSER"; do sleep 2; done
      containers:
        - name: parser
          image: "{{ .Values.parser.image.repository }}:{{ .Values.parser.image.tag }}"
          imagePullPolicy: {{ .Values.parser.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentialsSecret }}
          env:
            - name: PYTHONPATH
              value: /app:/app/api:/app/graph
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          command:
            - celery
            - -A
            - worker.celery_app
            - worker
            - --loglevel=info
            - -Q
            - {{ .Values.parser.queue }}
          resources:
            {{- toYaml .Values.parser.resources | nindent 12 }}
{{- end }}
